<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>London Trip Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@500&display=swap">
<style>
/* Layout: sticky header with a scrolling day strip over a single-column timeline; each day wears a rail-map line color; a floating button opens a currency sheet. */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --ink: #0D1B2E;
  --muted: #56677F;
  --line: #D5DCE8;
  --accent: #0019A8;
  --accent-ink: #FFFFFF;
  --soft: #E3E9F7;
  --signal: #B3162B;
  --ok: #1F7A4C;
  --scrim: rgba(5, 10, 20, 0.55);
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Overpass', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Overpass Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1322;
    --surface: #111D33;
    --ink: #E8EEF8;
    --muted: #95A5BE;
    --line: #24334F;
    --accent: #7B96FF;
    --accent-ink: #0A1322;
    --soft: #182645;
    --signal: #FF7A8A;
    --ok: #5CCB92;
    --scrim: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1322;
  --surface: #111D33;
  --ink: #E8EEF8;
  --muted: #95A5BE;
  --line: #24334F;
  --accent: #7B96FF;
  --accent-ink: #0A1322;
  --soft: #182645;
  --signal: #FF7A8A;
  --ok: #5CCB92;
  --scrim: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
}
.top h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 40px;
  line-height: 0.95;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.top .dates {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.count {
  flex: 0 0 auto;
  font-family: var(--f-mono);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--soft);
  color: var(--accent);
  white-space: nowrap;
}
.strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 12px;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
}
.strip::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto;
  width: 54px;
  padding: 7px 0 0;
  border: 1px solid var(--line);
  border-bottom: 5px solid var(--c);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  scroll-snap-align: center;
}
.day .dow {
  display: block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.day .num {
  display: block;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 26px;
  line-height: 1.1;
  padding-bottom: 4px;
}
.day[aria-current="true"] {
  background: var(--c);
  border-color: var(--c);
  color: #fff;
}
.day[aria-current="true"] .dow { color: rgba(255, 255, 255, 0.85); }

/* Day panel */
main { padding-block: 22px 120px; }
.kicker {
  margin: 0;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.dayhead h2 {
  margin: 4px 0 8px;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 34px;
  line-height: 1.05;
  text-wrap: balance;
}
.lede {
  margin: 0;
  max-width: 62ch;
  color: var(--muted);
}
.progress {
  margin: 10px 0 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--c);
}

.stops {
  list-style: none;
  margin: 22px 0 0;
  padding: 0;
}
.stop {
  display: grid;
  grid-template-columns: 4.6rem minmax(0, 1fr);
  column-gap: 0;
  padding-top: 18px;
}
.time {
  padding-top: 2px;
  font-family: var(--f-mono);
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.body {
  position: relative;
  min-width: 0;
  padding: 0 0 18px 18px;
  border-left: 3px solid var(--c);
  border-bottom: 1px solid transparent;
}
.stop:last-child .body { padding-bottom: 6px; border-left-color: transparent; }
.stop:last-child .body::before { left: -8px; }
.body::before {
  content: "";
  position: absolute;
  left: -9px;
  top: 4px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: var(--bg);
  border: 3px solid var(--c);
}
.stop.done .body::before { background: var(--c); }
.titlerow {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.titlerow h3 {
  margin: 0;
  font-family: var(--f-body);
  font-weight: 700;
  font-size: 17px;
  line-height: 1.25;
  text-wrap: balance;
}
.stop.done h3 { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.tick {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  margin: -4px -4px 0 0;
  padding: 0;
  display: grid;
  place-items: center;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: transparent;
  cursor: pointer;
}
.tick svg { width: 16px; height: 16px; }
.tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.note { margin: 4px 0 0; color: var(--muted); font-size: 15px; max-width: 58ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 4px;
  background: var(--soft);
  color: var(--accent);
}
.tag.alert { background: transparent; border: 1.5px solid var(--signal); color: var(--signal); padding: 1.5px 6px; }
.tag.good { background: transparent; border: 1.5px solid var(--ok); color: var(--ok); padding: 1.5px 6px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.go {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}
.go svg { width: 16px; height: 16px; flex: 0 0 auto; }
.go:active { transform: translateY(1px); }

.home {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.home p { margin: 0; font-size: 14px; color: var(--muted); }
.go.alt { background: transparent; color: var(--accent); border: 2px solid var(--accent); }

/* Currency */
.fab {
  position: fixed;
  z-index: 20;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 52px;
  padding: 0 20px;
  border: 0;
  border-radius: 26px;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
}
.fab small { font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }

.cvscrim { position: fixed; inset: 0; z-index: 29; background: transparent; }
.cvpop {
  position: fixed;
  z-index: 30;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  width: min(296px, calc(100vw - 32px));
  max-height: calc(100% - 100px);
  overflow-y: auto;
  display: grid;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
}
.cvhead { display: flex; align-items: center; gap: 6px; }
.cvhead h2 {
  flex: 1;
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.iconbtn {
  width: 36px;
  height: 36px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: var(--soft);
  color: var(--accent);
  cursor: pointer;
}
.iconbtn svg { width: 16px; height: 16px; }
.iconbtn.plain { background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
.cvdisplay {
  display: grid;
  gap: 2px;
  padding: 8px 12px 10px;
  border-radius: 10px;
  background: var(--bg);
  text-align: right;
}
.cvline { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cvclear {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.cvamt {
  min-width: 0;
  font-family: var(--f-mono);
  font-size: 22px;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.cvamt.empty { color: var(--muted); }
.cvout {
  display: block;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 36px;
  line-height: 1.05;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key {
  height: 46px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 10px;
  background: var(--soft);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 20px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.key:active { background: var(--line); }
.key svg { width: 22px; height: 22px; }
.cvrate { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.cvrate input {
  width: 4.5em;
  height: 30px;
  padding: 0 6px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-mono);
  font-size: 14px;
}
.cvrate input:focus { border-color: var(--accent); outline: none; }
.cvrate a { margin-left: auto; color: var(--accent); font-weight: 700; }

/* App updates (shown only inside the Android app) */
.topside { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.updbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 12px;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  background: transparent;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
}
.updbtn svg { width: 14px; height: 14px; }
.updbtn[disabled] { opacity: 0.55; }
.toast {
  position: fixed;
  z-index: 25;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 12px 16px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--bg);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
}
.toast p { flex: 1; min-width: 0; margin: 0; font-size: 14px; line-height: 1.35; }
.toast .tbtn {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 0 16px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  cursor: pointer;
}
.toast .tclose {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: inherit;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

/* Day change slide when swiping */
@keyframes slideFromRight { from { transform: translateX(28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
@keyframes slideFromLeft { from { transform: translateX(-28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
main.in-left { animation: slideFromRight 0.22s ease-out; }
main.in-right { animation: slideFromLeft 0.22s ease-out; }
@media (prefers-reduced-motion: reduce) { main.in-left, main.in-right { animation: none; } }

@media (max-width: 380px) {
  .top h1 { font-size: 34px; }
  .stop { grid-template-columns: 4.1rem minmax(0, 1fr); }
  .result { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1>London</h1>
        <p class="dates">Feb 20 to 28, 2027 &middot; Covent Garden</p>
      </div>
      <div class="topside">
        <div class="count" id="count">&nbsp;</div>
        <button class="updbtn" id="upd" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="updLabel">Update</span>
        </button>
      </div>
    </div>
    <nav class="strip" id="strip" aria-label="Trip days"></nav>
  </div>
</header>

<main class="wrap" id="panel" aria-live="polite"></main>

<div class="toast" id="toast" role="status" hidden>
  <p id="toastMsg"></p>
  <button class="tbtn" id="toastAct" type="button" hidden>Install</button>
  <button class="tclose" id="toastClose" type="button" aria-label="Dismiss">&times;</button>
</div>

<button class="fab" id="fab" type="button" aria-haspopup="dialog" aria-expanded="false">
  <span>&pound; &rarr; $</span><small>Convert</small>
</button>

<div class="cvscrim" id="cvscrim" hidden></div>
<div class="cvpop" id="cvpop" role="dialog" aria-labelledby="cvTitle" hidden>
  <div class="cvhead">
    <h2 id="cvTitle">&pound; to $</h2>
    <button class="iconbtn" id="swap" type="button" aria-label="Swap direction">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="iconbtn plain" id="close" type="button" aria-label="Close converter">&times;</button>
  </div>
  <div class="cvdisplay">
    <div class="cvline">
      <button class="cvclear" id="cvClear" type="button">Clear</button>
      <span class="cvamt" id="cvAmt" aria-label="Amount">&pound;0</span>
    </div>
    <output class="cvout" id="cvOut" aria-live="polite">$0.00</output>
  </div>
  <div class="keypad" id="keypad">
    <button class="key" type="button" data-k="1">1</button>
    <button class="key" type="button" data-k="2">2</button>
    <button class="key" type="button" data-k="3">3</button>
    <button class="key" type="button" data-k="4">4</button>
    <button class="key" type="button" data-k="5">5</button>
    <button class="key" type="button" data-k="6">6</button>
    <button class="key" type="button" data-k="7">7</button>
    <button class="key" type="button" data-k="8">8</button>
    <button class="key" type="button" data-k="9">9</button>
    <button class="key" type="button" data-k=".">.</button>
    <button class="key" type="button" data-k="0">0</button>
    <button class="key" type="button" data-k="back" aria-label="Delete">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9l-6-7zM12.5 9.5l5 5M17.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="cvrate">
    <label for="rate">1 &pound; = $</label>
    <input id="rate" type="text" inputmode="decimal" autocomplete="off" value="1.30">
    <a href="https://www.google.com/search?q=GBP+to+USD" target="_blank" rel="noopener">Live rate</a>
  </div>
</div>

    { t: 'Parks and a farewell dinner', c: '#C25A00',

      stops: [

        { time: '12:00 PM', title: 'Flexible afternoon', note: 'Pick up souvenirs or revisit a favorite spot from the week.' },

      ] },
    { t: 'Departure', c: '#5C6670',
      lede: 'This plan leaves the hotel by 10:00 AM. Work backward from your actual flight time.',
      stops: [
        { time: '8:30 AM', title: 'Full English breakfast at The Delaunay', note: 'On Aldwych, a short walk from the hotel.', m: 'walking',
          places: [{ q: 'The Delaunay, Aldwych, London' }] },

        { time: '10:00 AM', title: 'Piccadilly Line to Heathrow', note: 'Walk to Covent Garden Station, tap in, and ride straight to the airport.', m: 'transit',
          places: [{ l: 'Heathrow', q: 'Heathrow Airport, London' }] }
      ] }
  ];

  var START = new Date(2027, 1, 20);
  var ICON_GO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4.5 21l7.5-4 7.5 4z" fill="currentColor"/></svg>';
  var ICON_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Storage helpers: everything works without them.
  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  function el(tag, props) {
    var n = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else if (v !== false && v != null) n.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null || c === false) continue;
        n.appendChild(c.nodeType ? c : document.createTextNode(c));
      }
    }
    return n;
  }

  function dirUrl(q, mode) {
    return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(q) + '&travelmode=' + (mode || 'walking');
  }
  function dateOf(i) { return new Date(2027, 1, 20 + i); }
  function dayMs(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

  var done = load('ldn.done', {});
  var current = 0;
  var strip = document.getElementById('strip');
  var panel = document.getElementById('panel');
  var pills = [];

  function buildStrip() {
    DAYS.forEach(function (d, i) {
      var dt = dateOf(i);
      var b = el('button', { type: 'button', class: 'day', 'aria-label': 'Day ' + (i + 1) + ', ' + dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }), onclick: function () { show(i, true); } },
        el('span', { class: 'dow', text: dt.toLocaleDateString('en-US', { weekday: 'short' }) }),
        el('span', { class: 'num', text: String(dt.getDate()) }));
      b.style.setProperty('--c', d.c);
      pills.push(b);
      strip.appendChild(b);
    });
  }

  function countText() {
    var today = dayMs(new Date());
    var diff = Math.round((dayMs(START) - today) / 86400000);
    if (diff > 0) return diff + (diff === 1 ? ' day to go' : ' days to go');
    var n = -diff;
    if (n >= 0 && n < DAYS.length) return 'Day ' + (n + 1) + ' today';
    return 'Trip complete';
  }

  function tagEl(raw) {
    var kind = '';
    var text = raw;
    if (raw.charAt(0) === '!') { kind = ' alert'; text = raw.slice(1); }
    else if (raw.charAt(0) === '+') { kind = ' good'; text = raw.slice(1); }
    return el('span', { class: 'tag' + kind, text: text });
  }

  function show(i, userTap) {
    current = i;
    save('ldn.day', i);
    var d = DAYS[i];
    var dt = dateOf(i);
    pills.forEach(function (p, k) {
      if (k === i) p.setAttribute('aria-current', 'true'); else p.removeAttribute('aria-current');
    });
    if (userTap) {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      try { pills[i].scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }
      window.scrollTo(0, 0);
    }
    panel.style.setProperty('--c', d.c);
    panel.textContent = '';

    var count = d.stops.filter(function (s, k) { return done[i + '-' + k]; }).length;
    var progress = el('p', { class: 'progress', text: count + ' of ' + d.stops.length + ' done' });

    panel.appendChild(el('div', { class: 'dayhead' },
      el('p', { class: 'kicker', text: 'DAY ' + (i + 1) + ' · ' + dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }).toUpperCase() }),
      el('h2', { text: d.t }),
      el('p', { class: 'lede', text: d.lede }),
      progress));

    var list = el('ol', { class: 'stops' });
    d.stops.forEach(function (s, k) {
      var key = i + '-' + k;
      var li = el('li', { class: 'stop' + (done[key] ? ' done' : '') });
      var tick = el('button', { type: 'button', class: 'tick', 'aria-pressed': done[key] ? 'true' : 'false', 'aria-label': 'Mark done: ' + s.title, html: ICON_OK,
        onclick: function () {
          done[key] = !done[key];
          if (!done[key]) delete done[key];
          save('ldn.done', done);
          li.classList.toggle('done', !!done[key]);
          tick.setAttribute('aria-pressed', done[key] ? 'true' : 'false');
          var n = d.stops.filter(function (x, z) { return done[i + '-' + z]; }).length;
          progress.textContent = n + ' of ' + d.stops.length + ' done';
        } });
      var body = el('div', { class: 'body' },
        el('div', { class: 'titlerow' }, el('h3', { text: s.title }), tick),
        s.note ? el('p', { class: 'note', text: s.note }) : null,
        s.tags && s.tags.length ? el('div', { class: 'tags' }, s.tags.map(tagEl)) : null);
      if (s.places && s.places.length) {
        var many = s.places.length > 1;
        body.appendChild(el('div', { class: 'actions' }, s.places.map(function (p) {
          return el('a', { class: 'go', href: dirUrl(p.q, s.m), target: '_blank', rel: 'noopener', 'aria-label': 'Directions to ' + (p.l || s.title) },
            el('span', { html: ICON_GO, style: 'display:inline-flex' }),
            many ? 'Directions: ' + p.l : 'Directions');
        })));
      }
      li.appendChild(el('div', { class: 'time', text: s.time }));
      li.appendChild(body);
      list.appendChild(li);
    });
    panel.appendChild(list);

    panel.appendChild(el('div', { class: 'home' },
      el('p', { text: 'Lost or done for the day?' }),
      el('a', { class: 'go alt', href: dirUrl(HOTEL, 'transit'), target: '_blank', rel: 'noopener' },
        el('span', { html: ICON_GO, style: 'display:inline-flex' }), 'Directions to the hotel')));
  }

  // Currency converter: small popup with a number pad
  var $ = function (id) { return document.getElementById(id); };
  var savedRates = load('ldn.rates', { GBP: 1.30 });
  var cv = { toUsd: true, amount: '', rate: (savedRates && savedRates.GBP > 0) ? savedRates.GBP : 1.30 };
  var fab = $('fab'), pop = $('cvpop'), cvScrim = $('cvscrim'), amtEl = $('cvAmt'), outEl = $('cvOut'), rateEl = $('rate');

  function money(n, cur) {
    try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: cur }).format(n); }
    catch (e) { return (cur === 'GBP' ? '\u00A3' : '$') + n.toFixed(2); }
  }
  function parseNum(s) {
    var n = parseFloat(String(s).replace(/,/g, ''));
    return isFinite(n) && n >= 0 ? n : NaN;
  }
  function renderCv() {
    var fromSym = cv.toUsd ? '\u00A3' : '$';
    $('cvTitle').textContent = cv.toUsd ? '\u00A3 to $' : '$ to \u00A3';
    amtEl.textContent = fromSym + (cv.amount === '' ? '0' : cv.amount);
    amtEl.classList.toggle('empty', cv.amount === '');
    var amt = cv.amount === '' ? 0 : parseNum(cv.amount);
    var r = cv.rate;
    if (isNaN(amt) || !(r > 0)) { outEl.textContent = '\u2014'; return; }
    outEl.textContent = money(cv.toUsd ? amt * r : amt / r, cv.toUsd ? 'USD' : 'GBP');
  }
  function press(k) {
    var a = cv.amount;
    if (k === 'back') a = a.slice(0, -1);
    else if (k === 'clear') a = '';
    else if (k === '.') { if (a.indexOf('.') < 0) a = (a === '' ? '0' : a) + '.'; }
    else {
      var dot = a.indexOf('.');
      if (dot >= 0 && a.length - dot > 2) return;
      if (dot < 0 && a.replace(/^0+/, '').length >= 7) return;
      a = (a === '0') ? k : a + k;
    }
    cv.amount = a;
    renderCv();
  }
  function openCv() {
    pop.hidden = false;
    cvScrim.hidden = false;
    fab.setAttribute('aria-expanded', 'true');
    rateEl.value = Math.abs(cv.rate * 100 - Math.round(cv.rate * 100)) < 1e-9 ? cv.rate.toFixed(2) : String(cv.rate);
    renderCv();
  }
  function closeCv() {
    pop.hidden = true;
    cvScrim.hidden = true;
    fab.setAttribute('aria-expanded', 'false');
  }

  fab.addEventListener('click', function () { if (pop.hidden) openCv(); else closeCv(); });
  $('close').addEventListener('click', closeCv);
  cvScrim.addEventListener('click', closeCv);
  $('cvClear').addEventListener('click', function () { press('clear'); });
  $('swap').addEventListener('click', function () { cv.toUsd = !cv.toUsd; renderCv(); });
  $('keypad').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]');
    if (b) press(b.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function (e) {
    if (pop.hidden || e.target === rateEl) return;
    if (e.key === 'Escape') closeCv();
    else if (/^[0-9]$/.test(e.key) || e.key === '.') press(e.key);
    else if (e.key === 'Backspace') press('back');
  });
  rateEl.addEventListener('input', function () {
    var r = parseNum(rateEl.value);
    if (r > 0) { cv.rate = r; save('ldn.rates', { GBP: r }); }
    renderCv();
  });

  // App updates: the Android app exposes window.AndroidApp; on the web the button stays hidden.
  var app = window.AndroidApp;
  var updBtn = $('upd'), toast = $('toast'), toastMsg = $('toastMsg'), toastAct = $('toastAct');
  var toastTimer = null;
  function showToast(msg, withInstall, sticky) {
    clearTimeout(toastTimer);
    toastMsg.textContent = msg;
    toastAct.hidden = !withInstall;
    toast.hidden = false;
    if (!sticky) toastTimer = setTimeout(function () { toast.hidden = true; }, 6000);
  }
  function setBusy(on, label) {
    updBtn.disabled = on;
    $('updLabel').textContent = label || 'Update';
  }
  if (app && typeof app.checkForUpdate === 'function') {
    updBtn.hidden = false;
    try { updBtn.title = 'Installed version v' + app.getVersion(); } catch (e) { /* ignore */ }
    updBtn.addEventListener('click', function () {
      setBusy(true, 'Checking');
      showToast('Checking GitHub for a new version…', false, true);
      app.checkForUpdate();
    });
    toastAct.addEventListener('click', function () {
      toastAct.hidden = true;
      setBusy(true, 'Updating');
      app.installUpdate();
    });
  }
  $('toastClose').addEventListener('click', function () { toast.hidden = true; });
  window.onUpdateStatus = function (state, msg) {
    if (state === 'available') { setBusy(false); showToast(msg, true, true); }
    else if (state === 'downloading') { setBusy(true, 'Updating'); showToast(msg, false, true); }
    else if (state === 'installing') { setBusy(false); showToast(msg, false, false); }
    else if (state === 'permission') { setBusy(false); showToast(msg, true, true); }
    else { setBusy(false); showToast(msg, false, state === 'error'); }
  };

  // Swipe left for the next day, right for the previous day.
  var swipeX = null, swipeY = 0;
  function swipeIgnored(t) {
    return !t || !t.closest || !!t.closest('.strip, #cvpop, #toast, input');
  }
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || !pop.hidden || swipeIgnored(e.target)) { swipeX = null; return; }
    swipeX = e.touches[0].clientX;
    swipeY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (swipeX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeX, dy = t.clientY - swipeY;
    swipeX = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var next = current + (dx < 0 ? 1 : -1);
    if (next < 0 || next >= DAYS.length) return;
    show(next, true);
    panel.classList.remove('in-left', 'in-right');
    void panel.offsetWidth;
    panel.classList.add(dx < 0 ? 'in-left' : 'in-right');
  }, { passive: true });
  document.addEventListener('touchcancel', function () { swipeX = null; }, { passive: true });

  // Start
  buildStrip();
  $('count').textContent = countText();
  var todayIdx = Math.round((dayMs(new Date()) - dayMs(START)) / 86400000);
  var start = (todayIdx >= 0 && todayIdx < DAYS.length) ? todayIdx : load('ldn.day', 0);
  if (typeof start !== 'number' || start < 0 || start >= DAYS.length) start = 0;
  show(start, false);
  renderCv();
  try { pills[start].scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, 0); } catch (e) { /* ignore */ }
})();
