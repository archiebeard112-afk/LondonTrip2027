<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London Trip Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@500&display=swap">
<style>
/* Layout: compact sticky header + day strip; a "next up" card; then a timeline where each stop carries
   a type icon on the rail, travel legs sit between stops, and details (history, map buttons) stay compact. */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --ink: #0D1B2E;
  --muted: #56677F;
  --line: #D5DCE8;
  --accent: #0019A8;
  --accent-ink: #FFFFFF;
  --soft: #E3E9F7;
  --signal: #B3162B;
  --ok: #1F7A4C;
  --k-sight: #0019A8;
  --k-food: #B4471C;
  --k-pub: #8A5A00;
  --k-travel: #56677F;
  --k-show: #9B0056;
  --shadow: rgba(13, 27, 46, 0.16);
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Overpass', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Overpass Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1322; --surface: #111D33; --ink: #E8EEF8; --muted: #95A5BE; --line: #24334F;
    --accent: #7B96FF; --accent-ink: #0A1322; --soft: #182645; --signal: #FF7A8A; --ok: #5CCB92;
    --k-sight: #7B96FF; --k-food: #FF8F5E; --k-pub: #E7B54A; --k-travel: #95A5BE; --k-show: #FF6FB0;
    --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1322; --surface: #111D33; --ink: #E8EEF8; --muted: #95A5BE; --line: #24334F;
  --accent: #7B96FF; --accent-ink: #0A1322; --soft: #182645; --signal: #FF7A8A; --ok: #5CCB92;
  --k-sight: #7B96FF; --k-food: #FF8F5E; --k-pub: #E7B54A; --k-travel: #95A5BE; --k-show: #FF6FB0;
  --shadow: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; }
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 32px;
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }
.brand p b { color: var(--accent); font-weight: 700; }
.hbtns { display: flex; gap: 6px; flex: 0 0 auto; }
.hbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  padding: 0 12px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.hbtn svg.i { width: 16px; height: 16px; color: var(--accent); }
.hbtn .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.hbtn[disabled] { opacity: 0.55; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scroll-snap-type: x proximity; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto;
  width: 50px;
  padding: 5px 0 0;
  border: 1px solid var(--line);
  border-bottom: 4px solid var(--c);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  scroll-snap-align: center;
}
.day .dow { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.day .num { display: block; font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; padding-bottom: 3px; }
.day[aria-current="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.day[aria-current="true"] .dow { color: rgba(255, 255, 255, 0.85); }

main { padding-block: 18px 110px; }

/* Next-up card */
.next {
  display: grid;
  gap: 10px;
  margin-bottom: 20px;
  padding: 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: 0 4px 14px var(--shadow);
}
.next .eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c, var(--accent)); }
.next h3 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
.next .meta { margin: 0; font-size: 14px; color: var(--muted); }
.next .row { display: flex; flex-wrap: wrap; gap: 8px; }
.bigbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  flex: 1 1 auto;
}
.bigbtn.ghost { background: var(--soft); color: var(--accent); flex: 0 0 auto; }

/* Bookings */
.pin.book { background: var(--soft); color: var(--accent); }
.blink {
  flex: 0 0 auto;
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
}
.blink svg.i { width: 14px; height: 14px; }

.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

/* Flight price: plane + today's cheapest fare, tap to open it */
.pricechip {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 4px 14px 4px 4px;
  border: 1.5px solid var(--accent);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
}
.pricechip .plane { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); }
.pricechip .plane svg.i { width: 19px; height: 19px; }
.pricechip .amt { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.pricechip .for { font-size: 12px; color: var(--muted); }
.pricechip .chg { font-size: 12.5px; font-weight: 700; }
.pricechip .chg.down { color: var(--ok); }
.pricechip .chg.up { color: var(--signal); }
.pricechip .when { font-size: 12px; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); }
.pricechip .none { font-size: 14px; font-weight: 700; color: var(--accent); }

/* Day head */
.kicker { margin: 0; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
.dayhead h2 { margin: 4px 0 6px; font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: 1.05; text-wrap: balance; }
.lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 15px; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.summary span { display: inline-flex; align-items: center; gap: 5px; }
.summary svg.i { width: 15px; height: 15px; }
.summary .prog { margin-left: auto; font-weight: 700; color: var(--c); }

/* Timeline */
.stops { list-style: none; margin: 16px 0 0; padding: 0; }
.stop { display: grid; grid-template-columns: 4.2rem 36px minmax(0, 1fr); }
.leg { display: contents; }
.leg .lt { grid-column: 2; display: flex; justify-content: center; }
.leg .lt::before { content: ""; width: 2px; background: var(--line); }
.leg .lx {
  grid-column: 3;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0 8px 10px;
  font-size: 13px;
  color: var(--muted);
}
.leg .lx svg.i { width: 16px; height: 16px; }
.leg .lx b { color: var(--ink); font-weight: 600; }
.time { grid-column: 1; padding-top: 8px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail { grid-column: 2; display: flex; flex-direction: column; align-items: center; }
.dot {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--k);
  color: var(--k);
}
.dot svg.i { width: 17px; height: 17px; }
.rail::after { content: ""; flex: 1; width: 2px; background: var(--line); }
.stop:last-child .rail::after { background: transparent; }
.card { grid-column: 3; min-width: 0; padding: 6px 0 14px 10px; }
.titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.titlerow h3 { margin: 0; padding-top: 5px; font-size: 17px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.note { margin: 3px 0 0; color: var(--muted); font-size: 14.5px; max-width: 58ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.tag {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  border: 1.5px solid var(--line);
  color: var(--muted);
}
.tag.alert { border-color: var(--signal); color: var(--signal); }
.tag.good { border-color: var(--ok); color: var(--ok); }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.pin {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 14px 0 11px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13.5px;
  font-weight: 700;
  text-decoration: none;
}
.pin svg.i { width: 17px; height: 17px; }
.hist {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 13px 0 11px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}
.hist svg.i { width: 16px; height: 16px; color: var(--accent); }
.hist[aria-expanded="true"] { background: var(--soft); border-color: var(--soft); }
.info {
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 14.5px;
  line-height: 1.5;
}
.info p { margin: 0; }
.info p + p { margin-top: 8px; }
.info .lbl { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--k); }

.tick {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: transparent;
  cursor: pointer;
}
.tick svg.i { width: 16px; height: 16px; stroke-width: 3; }
.tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* Done stops fold to one line */
.stop.done .dot { background: var(--k); color: var(--surface); }
.stop.done .titlerow h3 { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.stop.done .note, .stop.done .tags, .stop.done .actions, .stop.done .info { display: none; }
.stop.done .card { padding-bottom: 8px; }

.home { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.home p { margin: 0; font-size: 14px; color: var(--muted); }

/* Sheets (bookings) */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 10, 20, 0.5); }
.sheet {
  position: fixed;
  z-index: 41;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 86%;
  overflow-y: auto;
  margin: 0 auto;
  max-width: 640px;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  padding-top: 16px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheethead h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: 0.02em; }
.xbtn { width: 40px; height: 40px; margin-right: -8px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 26px; line-height: 1; cursor: pointer; }
.sheet .sub { margin: 4px 0 12px; font-size: 14px; color: var(--muted); }
.blist { list-style: none; margin: 0; padding: 0; }
.bitem { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.bitem .tick { margin-top: 2px; }
.bitem .bt { min-width: 0; flex: 1; }
.bitem h4 { margin: 0; font-size: 16px; }
.bitem p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.bitem.done h4 { color: var(--muted); text-decoration: line-through; }

/* Converter */
.fab {
  position: fixed;
  z-index: 20;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 52px;
  height: 52px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.01em;
  cursor: pointer;
  box-shadow: 0 6px 18px var(--shadow);
}
.cvscrim { position: fixed; inset: 0; z-index: 29; background: transparent; }
.cvpop {
  position: fixed;
  z-index: 30;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  width: min(296px, calc(100vw - 32px));
  max-height: calc(100% - 100px);
  overflow-y: auto;
  display: grid;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 12px 32px var(--shadow);
}
.cvhead { display: flex; align-items: center; gap: 6px; }
.cvhead h2 { flex: 1; margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase; }
.iconbtn { width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--soft); color: var(--accent); cursor: pointer; }
.iconbtn.plain { background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
.cvdisplay { display: grid; gap: 2px; padding: 8px 12px 10px; border-radius: 10px; background: var(--bg); text-align: right; }
.cvline { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cvclear { padding: 4px 0; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
.cvamt { min-width: 0; font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cvamt.empty { color: var(--muted); }
.cvout { display: block; font-family: var(--f-display); font-weight: 700; font-size: 36px; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.key { height: 46px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--soft); color: var(--ink); font-family: var(--f-mono); font-size: 20px; cursor: pointer; user-select: none; }
.key:active { background: var(--line); }
.key svg.i { width: 22px; height: 22px; }
.cvrate { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
.cvrate input { width: 4.5em; height: 30px; padding: 0 6px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-size: 14px; }
.cvrate input:focus { border-color: var(--accent); outline: none; }
.cvrate a { margin-left: auto; color: var(--accent); font-weight: 700; }

/* Update toast */
.toast {
  position: fixed;
  z-index: 25;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 12px 12px 16px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--bg);
  box-shadow: 0 8px 24px var(--shadow);
}
.toast p { flex: 1; min-width: 0; margin: 0; font-size: 14px; line-height: 1.35; }
.toast .tbtn { flex: 0 0 auto; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
.toast .tclose { flex: 0 0 auto; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 22px; line-height: 1; cursor: pointer; }

/* Swipe slide */
@keyframes slideFromRight { from { transform: translateX(28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
@keyframes slideFromLeft { from { transform: translateX(-28px); opacity: 0.35; } to { transform: none; opacity: 1; } }
main.in-left { animation: slideFromRight 0.22s ease-out; }
main.in-right { animation: slideFromLeft 0.22s ease-out; }

@media (max-width: 370px) {
  .brand h1 { font-size: 27px; }
  .hbtn .lbl { display: none; }
  .stop { grid-template-columns: 3.7rem 34px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1>London</h1>
        <p>Feb 20&ndash;28, 2027 &middot; <b id="count">&nbsp;</b></p>
      </div>
      <div class="hbtns">
        <button class="hbtn" id="bookBtn" type="button" aria-haspopup="dialog">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
          <span class="lbl">Bookings</span> <span class="n" id="bookCount"></span>
        </button>
        <button class="hbtn" id="upd" type="button" hidden>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          <span class="lbl" id="updLabel">Update</span>
        </button>
      </div>
    </div>
    <nav class="strip" id="strip" aria-label="Trip days"></nav>
  </div>
</header>

<main class="wrap" id="panel"></main>

<div class="toast" id="toast" role="status" hidden>
  <p id="toastMsg"></p>
  <button class="tbtn" id="toastAct" type="button" hidden>Install</button>
  <button class="tclose" id="toastClose" type="button" aria-label="Dismiss">&times;</button>
</div>

<button class="fab" id="fab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Pounds to dollars converter">&pound;$</button>

<div class="cvscrim" id="cvscrim" hidden></div>
<div class="cvpop" id="cvpop" role="dialog" aria-labelledby="cvTitle" hidden>
  <div class="cvhead">
    <h2 id="cvTitle">&pound; to $</h2>
    <button class="iconbtn" id="swap" type="button" aria-label="Swap direction">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
    </button>

  }
  function parseNum(s) {
    var n = parseFloat(String(s).replace(/,/g, ''));
    return isFinite(n) && n >= 0 ? n : NaN;
  }
  function renderCv() {
    var fromSym = cv.toUsd ? '£' : '$';
    $('cvTitle').textContent = cv.toUsd ? '£ to $' : '$ to £';
    amtEl.textContent = fromSym + (cv.amount === '' ? '0' : cv.amount);
    amtEl.classList.toggle('empty', cv.amount === '');
    var amt = cv.amount === '' ? 0 : parseNum(cv.amount);
    var r = cv.rate;
    if (isNaN(amt) || !(r > 0)) { outEl.textContent = '—'; return; }
    outEl.textContent = money(cv.toUsd ? amt * r : amt / r, cv.toUsd ? 'USD' : 'GBP');
  }
  function press(k) {
    var a = cv.amount;
    if (k === 'back') a = a.slice(0, -1);
    else if (k === 'clear') a = '';
    else if (k === '.') { if (a.indexOf('.') < 0) a = (a === '' ? '0' : a) + '.'; }
    else {
      var dot = a.indexOf('.');
      if (dot >= 0 && a.length - dot > 2) return;
      if (dot < 0 && a.replace(/^0+/, '').length >= 7) return;
      a = (a === '0') ? k : a + k;
    }
    cv.amount = a;
    renderCv();
  }
  function openCv() {
    pop.hidden = false; cvScrim.hidden = false;
    fab.setAttribute('aria-expanded', 'true');
    rateEl.value = Math.abs(cv.rate * 100 - Math.round(cv.rate * 100)) < 1e-9 ? cv.rate.toFixed(2) : String(cv.rate);
    renderCv();
  }
  function closeCv() {
    pop.hidden = true; cvScrim.hidden = true;
    fab.setAttribute('aria-expanded', 'false');
  }
  fab.addEventListener('click', function () { if (pop.hidden) openCv(); else closeCv(); });
  $('cvClose').addEventListener('click', closeCv);
  cvScrim.addEventListener('click', closeCv);
  $('cvClear').addEventListener('click', function () { press('clear'); });
  $('swap').addEventListener('click', function () { cv.toUsd = !cv.toUsd; renderCv(); });
  $('keypad').addEventListener('click', function (e) {
    var b = e.target.closest('[data-k]');
    if (b) press(b.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeCv(); closeBookings(); return; }
    if (pop.hidden || e.target === rateEl) return;
    if (/^[0-9]$/.test(e.key) || e.key === '.') press(e.key);
    else if (e.key === 'Backspace') press('back');
  });
  rateEl.addEventListener('input', function () {
    var r = parseNum(rateEl.value);
    if (r > 0) { cv.rate = r; save('ldn.rates', { GBP: r }); }
    renderCv();
  });

  // App updates: the Android app exposes window.AndroidApp; on the web the button stays hidden.
  var app = window.AndroidApp;
  var updBtn = $('upd'), toast = $('toast'), toastMsg = $('toastMsg'), toastAct = $('toastAct');
  var toastTimer = null;
  function showToast(msg, withInstall, sticky) {
    clearTimeout(toastTimer);
    toastMsg.textContent = msg;
    toastAct.hidden = !withInstall;
    toast.hidden = false;
    if (!sticky) toastTimer = setTimeout(function () { toast.hidden = true; }, 6000);
  }
  function setBusy(on, label) {
    updBtn.disabled = on;
    $('updLabel').textContent = label || 'Update';
  }
  if (app && typeof app.checkForUpdate === 'function') {
    updBtn.hidden = false;
    try { updBtn.title = 'Installed version v' + app.getVersion(); } catch (e) { /* ignore */ }
    updBtn.addEventListener('click', function () {
      setBusy(true, 'Checking');
      showToast('Checking GitHub for a new version…', false, true);
      app.checkForUpdate();
    });
    toastAct.addEventListener('click', function () {
      toastAct.hidden = true;
      setBusy(true, 'Updating');
      app.installUpdate();
    });
  }
  $('toastClose').addEventListener('click', function () { toast.hidden = true; });
  window.onUpdateStatus = function (state, msg) {
    if (state === 'available') { setBusy(false); showToast(msg, true, true); }
    else if (state === 'downloading') { setBusy(true, 'Updating'); showToast(msg, false, true); }
    else if (state === 'installing') { setBusy(false); showToast(msg, false, false); }
    else if (state === 'permission') { setBusy(false); showToast(msg, true, true); }
    else { setBusy(false); showToast(msg, false, state === 'error'); }
  };

  // Swipe left for the next day, right for the previous day.
  var swipeX = null, swipeY = 0;
  function swipeIgnored(t) {
    return !t || !t.closest || !!t.closest('.strip, #cvpop, #toast, #bookSheet, input');
  }
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || !pop.hidden || !$('bookSheet').hidden || swipeIgnored(e.target)) { swipeX = null; return; }
    swipeX = e.touches[0].clientX;
    swipeY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (swipeX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeX, dy = t.clientY - swipeY;
    swipeX = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var next = current + (dx < 0 ? 1 : -1);
    if (next < 0 || next >= DAYS.length) return;
    show(next, true);
    panel.classList.remove('in-left', 'in-right');
    void panel.offsetWidth;
    panel.classList.add(dx < 0 ? 'in-left' : 'in-right');
  }, { passive: true });
  document.addEventListener('touchcancel', function () { swipeX = null; }, { passive: true });

  // Start
  syncFlightsBooked();
  if (app && typeof app.getPrices === 'function') {
    setPrices(app.getPrices());
    app.refreshPrices();
  } else if (window.fetch) {
    fetch(FLIGHTS.prices, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (p) { if (p) window.onPrices(p); }).catch(function () { /* offline */ });
  }
  buildStrip();
  $('count').textContent = countText();
  renderBookCount();
  var todayIdx = tripDay();
  var start = (todayIdx >= 0 && todayIdx < DAYS.length) ? todayIdx : load('ldn.day', 0);
  if (typeof start !== 'number' || start < 0 || start >= DAYS.length) start = 0;
  show(start, false);
  try { pills[start].scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, 0); } catch (e) { /* ignore */ }
})();
</script>
</body>
