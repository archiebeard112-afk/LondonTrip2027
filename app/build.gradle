plugins {
    id 'com.android.application'
}

// The build number from GitHub Actions becomes the app version, so each release is newer than the last.
def buildNumber = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def storePw = System.getenv('SIGNING_STORE_PASSWORD')

android {
    namespace 'com.londontrip.guide'
    compileSdk 34

    defaultConfig {
        applicationId 'com.londontrip.guide'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    signingConfigs {
        release {
            if (storePw) {
                storeFile rootProject.file('signing/release.jks')
                storePassword storePw
                keyAlias 'londontrip'
                keyPassword storePw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (storePw) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
